name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

  architecture-guard:
    name: Generic core guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject reference-implementation coupling in PHP
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.php' 'CulturalFunding|Financial Rocks|\bfr_' .; then exit 1; fi

  version-contract:
    name: Version contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify plugin, runtime and readme versions match
        shell: bash
        run: |
          set -euo pipefail
          plugin_version="$(grep -m1 -E '^[[:space:]]*\* Version:' crowdfunding-wordpress.php | sed -E 's/.*Version:[[:space:]]*//')"
          runtime_version="$(grep -m1 "define( 'CFWP_VERSION'" crowdfunding-wordpress.php | sed -E "s/.*'([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/")"
          stable_tag="$(grep -m1 '^Stable tag:' readme.txt | cut -d: -f2- | xargs)"
          test "$plugin_version" = "$runtime_version"
          test "$plugin_version" = "$stable_tag"

  promoter-contract:
    name: Promoter capability contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify promoter authority remains constrained
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "public const ROLE = 'cfwp_promoter';" includes/class-promoters.php
          grep -Fq "'capability_type'     => array( 'cfwp_campaign', 'cfwp_campaigns' )" includes/class-campaigns.php
          grep -Fq "'edit_cfwp_campaigns'            => true" includes/class-promoters.php
          grep -Fq "'publish_cfwp_campaigns'         => false" includes/class-promoters.php
          grep -Fq "'edit_others_cfwp_campaigns'     => false" includes/class-promoters.php
          grep -Fq "'edit_published_cfwp_campaigns'  => false" includes/class-promoters.php

  submission-contract:
    name: Frontend submission contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify submissions are authenticated, owned and pending
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "add_shortcode( 'crowdfunding_submit_campaign'" includes/class-campaign-submission.php
          grep -Fq "add_action( 'admin_post_' . self::ACTION" includes/class-campaign-submission.php
          grep -Fq "wp_verify_nonce( \$nonce, self::ACTION )" includes/class-campaign-submission.php
          grep -Fq "current_user_can( 'edit_cfwp_campaigns' )" includes/class-campaign-submission.php
          grep -Fq "'post_status'  => 'pending'" includes/class-campaign-submission.php
          grep -Fq "'post_author'  => get_current_user_id()" includes/class-campaign-submission.php
          grep -Fq "wp_validate_redirect( \$requested, home_url( '/' ) )" includes/class-campaign-submission.php

  dashboard-contract:
    name: Promoter dashboard contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dashboard remains current-user scoped
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "add_shortcode( 'crowdfunding_promoter_dashboard'" includes/class-promoter-dashboard.php
          grep -Fq "current_user_can( 'edit_cfwp_campaigns' )" includes/class-promoter-dashboard.php
          grep -Fq "'author'         => get_current_user_id()" includes/class-promoter-dashboard.php
          grep -Fq "'post_status'    => array( 'draft', 'pending', 'publish' )" includes/class-promoter-dashboard.php
          if grep -Eq "shortcode_atts\([^)]*(author|user_id)" includes/class-promoter-dashboard.php; then exit 1; fi
          if grep -Eq "\$_(GET|POST)\[[^]]*(author|user_id)" includes/class-promoter-dashboard.php; then exit 1; fi

  editor-contract:
    name: Frontend editor authority contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify editor remains owned, unpublished and status-neutral
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "add_shortcode( 'crowdfunding_edit_campaign'" includes/class-campaign-editor.php
          grep -Fq "add_action( 'admin_post_' . self::ACTION" includes/class-campaign-editor.php
          grep -Fq "private const EDITABLE_STATUSES = array( 'draft', 'pending' );" includes/class-campaign-editor.php
          grep -Fq "(int) \$campaign->post_author !== get_current_user_id()" includes/class-campaign-editor.php
          grep -Fq "current_user_can( 'edit_post', \$campaign->ID )" includes/class-campaign-editor.php
          grep -Fq "wp_verify_nonce( \$nonce, self::ACTION . '_' . \$campaign_id )" includes/class-campaign-editor.php
          grep -Fq "wp_update_post(" includes/class-campaign-editor.php
          grep -Fq "wp_validate_redirect( \$requested, home_url( '/' ) )" includes/class-campaign-editor.php
          if grep -Eq "'post_(author|status)'[[:space:]]*=>" includes/class-campaign-editor.php; then exit 1; fi

  registration-contract:
    name: Promoter registration authority contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify registration remains gated and role-forced
        shell: bash
        run: |
          set -euo pipefail
          file='includes/class-promoter-registration.php'
          grep -Fq "add_shortcode( 'crowdfunding_promoter_register'" "$file"
          grep -Fq "add_action( 'admin_post_nopriv_' . self::ACTION" "$file"
          grep -Fq "wp_verify_nonce( \$nonce, self::ACTION )" "$file"
          grep -Fq "get_option( 'users_can_register', false )" "$file"
          grep -Fq "'cfwp_promoter_registration_enabled'" "$file"
          grep -Fq "'role'       => Promoters::ROLE" "$file"
          grep -Fq "wp_set_auth_cookie( \$user_id" "$file"
          grep -Fq "wp_validate_redirect( \$requested, home_url( '/' ) )" "$file"
          if grep -Eq "\$_(GET|POST)\[[^]]*role" "$file"; then exit 1; fi

  contributions-contract:
    name: Contributions ledger contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify contribution schema, states and idempotency remain generic
        shell: bash
        run: |
          set -euo pipefail
          domain='includes/class-contributions.php'
          repo='includes/class-contribution-repository.php'
          grep -Fq "return \$wpdb->prefix . 'cfwp_contributions';" "$domain"
          grep -Fq "UNIQUE KEY source_reference (source,source_reference)" "$domain"
          grep -Fq "public const STATUS_PENDING   = 'pending';" "$domain"
          grep -Fq "public const STATUS_CONFIRMED = 'confirmed';" "$domain"
          grep -Fq "public const STATUS_REFUNDED  = 'refunded';" "$domain"
          grep -Fq "public const STATUS_CANCELLED = 'cancelled';" "$domain"
          grep -Fq "resolve_idempotent_record" "$repo"
          grep -Fq "cfwp_idempotency_conflict" "$repo"
          grep -Fq "Contributions::STATUS_CONFIRMED" "$repo"
          grep -Fq "null === \$this->find( \$contribution_id )" "$repo"
          if grep -Ei 'woocommerce|\bwc_' "$domain" "$repo"; then exit 1; fi

  woocommerce-adapter-contract:
    name: WooCommerce adapter contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HPOS-safe explicit-marker synchronization
        shell: bash
        run: |
          set -euo pipefail
          file='includes/class-woocommerce-adapter.php'
          grep -Fq "declare_compatibility(" "$file"
          grep -Fq "'custom_order_tables'" "$file"
          grep -Fq "woocommerce_checkout_order_created" "$file"
          grep -Fq "woocommerce_store_api_checkout_order_created" "$file"
          grep -Fq "woocommerce_order_status_changed" "$file"
          grep -Fq "public const ITEM_META_CAMPAIGN_ID = '_cfwp_campaign_id';" "$file"
          grep -Fq "public const ITEM_META_AMOUNT = '_cfwp_contribution_amount';" "$file"
          grep -Fq "'source'           => self::SOURCE" "$file"
          grep -Fq "wc_get_is_paid_statuses" "$file"
          grep -Fq "Contributions::STATUS_REFUNDED" "$file"
          grep -Fq "Contributions::STATUS_CANCELLED" "$file"
          if grep -Ei 'get_post_meta\(|wp_posts|wp_postmeta|shop_order' "$file"; then
            echo 'WooCommerce adapter must use CRUD objects and avoid legacy order storage coupling.'
            exit 1
          fi

  contribution-checkout-contract:
    name: Contribution checkout contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify secure exact-amount cart-to-order flow
        shell: bash
        run: |
          set -euo pipefail
          file='includes/class-contribution-checkout.php'
          grep -Fq "add_shortcode( 'crowdfunding_contribute'" "$file"
          grep -Fq "add_action( 'admin_post_nopriv_' . self::ACTION" "$file"
          grep -Fq "wp_verify_nonce( \$nonce, self::ACTION . '_' . \$campaign_id )" "$file"
          grep -Fq "get_woocommerce_currency()" "$file"
          grep -Fq "cfwp_minimum_contribution_amount" "$file"
          grep -Fq "wc_load_cart" "$file"
          grep -Fq "WC()->cart->add_to_cart(" "$file"
          grep -Fq "woocommerce_before_calculate_totals" "$file"
          grep -Fq "woocommerce_checkout_create_order_line_item" "$file"
          grep -Fq "WooCommerce_Adapter::ITEM_META_CAMPAIGN_ID" "$file"
          grep -Fq "WooCommerce_Adapter::ITEM_META_AMOUNT" "$file"
          grep -Fq "woocommerce_coupon_is_valid_for_product" "$file"
          grep -Fq "set_catalog_visibility( 'hidden' )" "$file"
          grep -Fq "set_sold_individually( true )" "$file"
          grep -Fq "set_tax_status( 'none' )" "$file"
          grep -Fq "has_shortcode( \$content, 'crowdfunding_contribute' )" "$file"
          if grep -Eq 'Contribution_Repository|Contributions::STATUS_' "$file"; then
            echo 'Checkout must not write contribution ledger authority directly.'
            exit 1
          fi

  campaign-progress-contract:
    name: Authoritative campaign progress contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public progress consumes net confirmed Core totals
        shell: bash
        run: |
          set -euo pipefail
          file='includes/class-campaign-progress.php'
          views='includes/class-shortcodes.php'
          repo='includes/class-contribution-adjustment-repository.php'
          grep -Fq "add_shortcode( 'crowdfunding_progress'" "$file"
          grep -Fq "net_confirmed_total_for_campaign( \$campaign_id )" "$file"
          grep -Fq "Campaigns::META_GOAL_AMOUNT" "$file"
          grep -Fq "Campaigns::META_CURRENCY" "$file"
          grep -Fq "min( 100.0, \$percentage )" "$file"
          grep -Fq 'role="progressbar"' "$file"
          grep -Fq 'aria-valuetext=' "$file"
          grep -Fq "render_progress( \$campaign->ID, true )" "$views"
          grep -Fq "render_progress( \$campaign->ID )" "$views"
          grep -Fq "str_contains( \$content, 'class=\"cfwp-progress' )" "$views"
          grep -Fq "c.status = %s" "$repo"
          grep -Fq "Contribution_Adjustments::STATUS_APPLIED" "$repo"
          if grep -Ei '\$wpdb|woocommerce|\bwc_|STATUS_PENDING|STATUS_CANCELLED|STATUS_REFUNDED' "$file"; then
            echo 'Public progress must consume the generic net-confirmed repository authority only.'
            exit 1
          fi

  refund-integrity-contract:
    name: Refund adjustment integrity contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify refunds remain immutable, attributable and idempotent
        shell: bash
        run: |
          set -euo pipefail
          domain='includes/class-contribution-adjustments.php'
          repo='includes/class-contribution-adjustment-repository.php'
          adapter='includes/class-woocommerce-refund-adapter.php'
          grep -Fq "return \$wpdb->prefix . 'cfwp_contribution_adjustments';" "$domain"
          grep -Fq "UNIQUE KEY source_reference (source,source_reference)" "$domain"
          grep -Fq "public const TYPE_REFUND = 'refund';" "$domain"
          grep -Fq "public const STATUS_APPLIED  = 'applied';" "$domain"
          grep -Fq "public const STATUS_REVERSED = 'reversed';" "$domain"
          grep -Fq "remaining_refundable_for_contribution" "$repo"
          grep -Fq "net_confirmed_total_for_campaign" "$repo"
          grep -Fq "reverse_by_source_prefix" "$repo"
          grep -Fq "cfwp_refund_exceeds_contribution" "$repo"
          grep -Fq "woocommerce_order_refunded" "$adapter"
          grep -Fq "woocommerce_delete_order_refund" "$adapter"
          grep -Fq "'_refunded_item_id'" "$adapter"
          grep -Fq "refund:%d:item:%d" "$adapter"
          grep -Fq "cfwp_woocommerce_refund_unallocated" "$adapter"
          grep -Fq "'refunded' === \$status" "$adapter"
          if grep -Ei 'woocommerce|\bwc_' "$domain" "$repo"; then
            echo 'The generic adjustment ledger must remain independent from WooCommerce.'
            exit 1
          fi
          if grep -Ei '\$wpdb|get_post_meta\(|wp_posts|wp_postmeta|shop_order' "$adapter"; then
            echo 'WooCommerce refund synchronization must use CRUD objects and generic repositories only.'
            exit 1
          fi
