name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

  architecture-guard:
    name: Generic core guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject reference-implementation coupling in PHP
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.php' 'CulturalFunding|Financial Rocks|\bfr_' .; then
            echo 'Reference implementation coupling detected in plugin PHP.'
            exit 1
          fi

  version-contract:
    name: Version contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify plugin, runtime and readme versions match
        shell: bash
        run: |
          set -euo pipefail
          plugin_version="$(grep -m1 -E '^[[:space:]]*\* Version:' crowdfunding-wordpress.php | sed -E 's/.*Version:[[:space:]]*//')"
          runtime_version="$(grep -m1 "define( 'CFWP_VERSION'" crowdfunding-wordpress.php | sed -E "s/.*'([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/")"
          stable_tag="$(grep -m1 '^Stable tag:' readme.txt | cut -d: -f2- | xargs)"

          printf 'Plugin header: %s\nRuntime: %s\nStable tag: %s\n' "$plugin_version" "$runtime_version" "$stable_tag"
          test "$plugin_version" = "$runtime_version"
          test "$plugin_version" = "$stable_tag"

  promoter-contract:
    name: Promoter capability contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify promoter authority remains constrained
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "public const ROLE = 'cfwp_promoter';" includes/class-promoters.php
          grep -Fq "'capability_type'     => array( 'cfwp_campaign', 'cfwp_campaigns' )" includes/class-campaigns.php
          grep -Fq "'edit_cfwp_campaigns'            => true" includes/class-promoters.php
          grep -Fq "'publish_cfwp_campaigns'         => false" includes/class-promoters.php
          grep -Fq "'edit_others_cfwp_campaigns'     => false" includes/class-promoters.php
          grep -Fq "'edit_published_cfwp_campaigns'  => false" includes/class-promoters.php
