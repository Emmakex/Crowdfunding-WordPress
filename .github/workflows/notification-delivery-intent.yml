name: Notification Delivery Intent

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  notification-delivery-intent-contract:
    name: Delivery intent contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify delivery intents remain channel-neutral, idempotent and read-only
        shell: bash
        run: |
          set -euo pipefail
          file='includes/class-notification-delivery-intents.php'
          plugin='includes/class-plugin.php'
          bootstrap='crowdfunding-wordpress.php'

          grep -Fq "final class Notification_Delivery_Intents" "$file"
          grep -Fq "cfwp_notification_recipients_resolved" "$file"
          grep -Fq "cfwp_notification_delivery_intent" "$file"
          grep -Fq "public static function build( array \$event, array \$recipients ): array" "$file"
          grep -Fq "'intent_key'" "$file"
          grep -Fq "'message_key'" "$file"
          grep -Fq "'event_key'" "$file"
          grep -Fq "Notification_Recipient_Resolver::TYPE_WP_USER" "$file"
          grep -Fq "Notification_Delivery_Intents::register();" "$plugin"
          grep -Fq "includes/class-notification-delivery-intents.php" "$bootstrap"
          grep -Fq "preg_match( '/^[a-z0-9]+(?:[._-][a-z0-9]+)*$/'" "$file"

          if grep -Fq "str_replace( '_', '.', \$name )" "$file"; then
            echo 'Delivery intents must not rewrite underscores inside canonical event names.' >&2
            exit 1
          fi

          if grep -Eiq 'wp_mail|smtp|mailgun|sendgrid|brevo|twilio|whatsapp|woocommerce|\bwc_' "$file"; then
            echo 'Delivery intents must remain transport-neutral and independent from commerce adapters.' >&2
            exit 1
          fi

          if grep -Eiq 'user_email|billing_|shipping_|first_name|last_name|display_name|phone' "$file"; then
            echo 'Delivery intents must contain stable recipient references, not PII or channel addresses.' >&2
            exit 1
          fi

          if grep -Eq 'update_post_meta[[:space:]]*\(|add_post_meta[[:space:]]*\(|delete_post_meta[[:space:]]*\(|wp_update_post[[:space:]]*\(|\$wpdb->(insert|update|delete)[[:space:]]*\(' "$file"; then
            echo 'Delivery intent construction must remain read-only.' >&2
            exit 1
          fi

      - name: Exercise canonical event-name preservation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cfwp-delivery-intents.php <<'PHP'
          <?php
          namespace {
              define( 'ABSPATH', __DIR__ );
              function sanitize_key( $value ) {
                  return (string) preg_replace( '/[^a-z0-9_\-]/', '', strtolower( (string) $value ) );
              }
              function absint( $value ) {
                  return abs( (int) $value );
              }
          }

          namespace Kairoseth\CrowdfundingWordPress {
              final class Notification_Recipient_Resolver {
                  public const TYPE_WP_USER = 'wp_user';
                  public const ROLE_CONTRIBUTOR = 'contributor';
                  public const ROLE_CAMPAIGN_OWNER = 'campaign_owner';
              }

              require getcwd() . '/includes/class-notification-delivery-intents.php';

              $recipients = array(
                  array(
                      'type'    => 'wp_user',
                      'user_id' => 7,
                      'roles'   => array( 'contributor' ),
                  ),
              );

              foreach ( array( 'reward_claim.created', 'reward_fulfillment.status_changed' ) as $event_name ) {
                  $intents = Notification_Delivery_Intents::build(
                      array(
                          'event_key' => 'event:' . $event_name,
                          'name'      => $event_name,
                      ),
                      $recipients
                  );

                  if ( 1 !== count( $intents ) ) {
                      fwrite( STDERR, "Expected one delivery intent for {$event_name}.\n" );
                      exit( 1 );
                  }

                  $intent = $intents[0];
                  if ( $event_name !== $intent['event_name'] ) {
                      fwrite( STDERR, "Canonical event name changed for {$event_name}.\n" );
                      exit( 1 );
                  }

                  if ( $event_name . '.contributor' !== $intent['message_key'] ) {
                      fwrite( STDERR, "Message key does not preserve {$event_name}.\n" );
                      exit( 1 );
                  }
              }

              if ( array() !== Notification_Delivery_Intents::build( array( 'event_key' => 'bad', 'name' => 'Reward Claim Created' ), $recipients ) ) {
                  fwrite( STDERR, "Invalid event names must fail closed.\n" );
                  exit( 1 );
              }
          }
          PHP

          php /tmp/cfwp-delivery-intents.php
          php -l includes/class-notification-delivery-intents.php
